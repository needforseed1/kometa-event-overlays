name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r imdb-sync/requirements.txt
      - run: python -m unittest discover -s imdb-sync -p 'test_*.py' -v
      - run: python -m unittest discover -s scoped-overlay -p 'test_*.py' -v
      - run: python -m py_compile imdb-sync/*.py scoped-overlay/*.py

  compose-and-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f compose.yml -f compose.build.yml build
